name: Check BSKV scraper request

on:
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:

jobs:
  check-request:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Manuelle Scraper-Anfrage pruefen
        run: npm run check-request

